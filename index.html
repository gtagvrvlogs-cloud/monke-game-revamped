<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Primate Playground - WebXR Zoo</title>
    <!-- A-Frame VR Framework -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- Physics System for Collision & Ragdolls -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <!-- Super Hands component for VR grabbing/throwing -->
    <script src="https://cdn.jsdelivr.net/gh/wmurphyrd/aframe-super-hands-component@v3.0.3/dist/super-hands.min.js"></script>
  </head>
  <body>
    <a-scene physics="debug: false; gravity: -9.8">
      
      <!-- Asset Management: Replace URLs below with your hosted 3D model files (.glb / .gltf) -->
      <a-assets>
        <!-- Zoo Enclosure Map Model -->
        <a-asset-item id="zoo-map" src="models/zoo_enclosure.glb"></a-asset-item>
        <!-- Legless Gorilla Tag Monkey Player Mesh -->
        <a-asset-item id="player-model" src="models/monkey_player.glb"></a-asset-item>
        <!-- Monkey Ragdoll NPC Model -->
        <a-asset-item id="ragdoll-model" src="models/monkey_npc.glb"></a-asset-item>
      </a-assets>

      <!-- Environment Lighting & Atmosphere -->
      <a-sky color="#90e0ef"></a-sky>
      <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" position="2 10 5" intensity="1.0" cast-shadow="true"></a-light>

      <!-- 3D Zoo Enclosure Environment -->
      <a-entity gltf-model="#zoo-map" position="0 0 0" static-body></a-entity>

      <!-- VR Player Rig (Gorilla Tag Style: Hand Locomotion + Torso Avatar) -->
      <a-entity id="rig" position="0 1.2 0">
        <!-- Floating Head/Torso Player Mesh -->
        <a-entity gltf-model="#player-model" position="0 0 0" dynamic-body="mass: 5; shape: sphere; sphereRadius: 0.4"></a-entity>
        
        <!-- Left Controller (Hand / Grabbing) -->
        <a-entity id="leftHand" 
                  hand-controls="hand: left" 
                  sphere-collider="objects: .grabbable" 
                  super-hands>
        </a-entity>
        
        <!-- Right Controller (Hand / Grabbing) -->
        <a-entity id="rightHand" 
                  hand-controls="hand: right" 
                  sphere-collider="objects: .grabbable" 
                  super-hands>
        </a-entity>
      </a-entity>

      <!-- Interactive Monkey Ragdoll NPC #1 -->
      <a-entity class="grabbable"
                gltf-model="#ragdoll-model" 
                position="-1.5 1.5 -3" 
                dynamic-body="mass: 2; shape: box"
                hoverable grabbable stretchable draggable dropable>
      </a-entity>

      <!-- Interactive Monkey Ragdoll NPC #2 -->
      <a-entity class="grabbable"
                gltf-model="#ragdoll-model" 
                position="1.5 1.5 -3" 
                dynamic-body="mass: 2; shape: box"
                hoverable grabbable stretchable draggable dropable>
      </a-entity>

    </a-scene>
  </body>
</html>
